name: build

on:
  push:
    branches: [stampit]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config gengetopt

      - name: Clone OpenSC (pinned) and apply StampIT patch
        env:
          OPENSC_COMMIT: aae270aa96d920aceffb3a76ad2bdc13a58e74b5
        run: |
          git clone https://github.com/OpenSC/OpenSC.git
          git -C OpenSC checkout "$OPENSC_COMMIT"
          git -C OpenSC apply "$GITHUB_WORKSPACE/patches/0001-opensc-iasecc-stampit-sdo-fallbacks.patch"

      - name: Bootstrap (OpenSSL + OpenPACE + OpenSC static libs, universal)
        run: bash bootstrap

      - name: Build OpenSCTokenApp
        run: |
          xcodebuild -target OpenSCTokenApp -configuration Release SYMROOT="$PWD/xcbuild" \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CFLAGS="-DNDEBUG"

      - name: Verify architectures and signature
        run: |
          APP=xcbuild/Release/OpenSCTokenApp.app
          lipo -info "$APP/Contents/MacOS/OpenSCTokenApp"
          lipo -info "$APP/Contents/PlugIns/OpenSCToken.appex/Contents/MacOS/OpenSCToken"
          codesign --verify --deep "$APP"

      - name: Package artifact
        run: ditto -c -k --keepParent xcbuild/Release/OpenSCTokenApp.app OpenSCTokenApp.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSCTokenApp
          path: OpenSCTokenApp.zip
          retention-days: 30
